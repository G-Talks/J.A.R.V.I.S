<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S Akıllı Rehber</title>
    <style>
        body { 
            background-color: #050505; 
            color: #00ffcc; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
        }
        #baslat-btn { 
            background-color: transparent; 
            border: 2px solid #00ffcc; 
            color: #00ffcc; 
            padding: 15px 40px; 
            font-size: 20px; 
            cursor: pointer; 
            border-radius: 8px; 
            transition: 0.3s; 
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        #baslat-btn:hover { 
            background-color: #00ffcc; 
            color: #050505; 
            box-shadow: 0 0 20px #00ffcc;
        }
        #ekran { 
            width: 80%;
            max-width: 600px;
            height: 200px;
            border: 1px solid #00ffcc;
            padding: 15px;
            overflow-y: auto;
            background-color: #111;
            box-shadow: inset 0 0 10px #000;
            text-align: left;
            font-size: 16px;
            line-height: 1.5;
        }
        .jarvis-mesaj { color: #00ffcc; margin-bottom: 10px; }
        .kullanici-mesaj { color: #fff; margin-bottom: 10px; font-style: italic; }
    </style>
</head>
<body>

    <h1>J.A.R.V.I.S V2.0</h1>
    <button id="baslat-btn">Sistemi Başlat / Dinle</button>
    <div id="ekran">
        <div class="jarvis-mesaj">Sistem beklemede... Asistanı başlatmak için butona tıklayın.</div>
    </div>

    <script>
        const btn = document.getElementById('baslat-btn');
        const ekranDiv = document.getElementById('ekran');

        // Ekrana yazı yazdırma fonksiyonu
        function logYazdir(kim, metin) {
            const satir = document.createElement('div');
            satir.className = kim === 'jarvis' ? 'jarvis-mesaj' : 'kullanici-mesaj';
            satir.innerHTML = (kim === 'jarvis' ? '<b>J.A.R.V.I.S:</b> ' : '<b>Siz:</b> ') + metin;
            ekranDiv.appendChild(satir);
            ekranDiv.scrollTop = ekranDiv.scrollHeight; // Otomatik aşağı kaydır
        }

        // Metni sese çevirme
        function konus(metin) {
            logYazdir('jarvis', metin);
            const asistanSesi = new SpeechSynthesisUtterance(metin);
            asistanSesi.lang = 'tr-TR';
            asistanSesi.rate = 1.0; 
            window.speechSynthesis.speak(asistanSesi);
        }

        // Web Tarayıcı Ses Tanıma Motoru
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            logYazdir('jarvis', "Tarayıcınız ses tanıma özelliğini desteklemiyor. Lütfen Google Chrome kullanın.");
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.interimResults = false;

            recognition.onstart = function() {
                btn.innerText = "Dinleniyor...";
                btn.style.backgroundColor = "#ff0055";
                btn.style.color = "#fff";
                btn.style.borderColor = "#ff0055";
            };

            recognition.onspeechend = function() {
                recognition.stop();
                btn.innerText = "Sistemi Başlat / Dinle";
                btn.style.backgroundColor = "transparent";
                btn.style.color = "#00ffcc";
                btn.style.borderColor = "#00ffcc";
            };

            recognition.onresult = function(event) {
                const sorgu = event.results[0][0].transcript.toLowerCase();
                logYazdir('kullanici', sorgu);
                
                // --- 1. TEMEL KOMUTLAR ---
                if (sorgu.includes("merhaba")) {
                    konus("Sistemler devrede Talha Bey. Size nasıl yardımcı olabilirim?");
                
                } else if (sorgu.includes("saat kaç")) {
                    const saat = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                    konus("Saat şu an " + saat);
                
                // --- 2. GÜNDEM VE HABERLER ---
                } else if (sorgu.includes("gündem") || sorgu.includes("haberler")) {
                    konus("Güncel manşetleri tarıyorum, lütfen bekleyin...");
                    fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.trthaber.com/manset_artikeller.rss')
                        .then(res => res.json())
                        .then(data => {
                            let haberler = data.items.slice(0, 3); // İlk 3 haber
                            konus("Gündemdeki öne çıkan 3 haber şöyle:");
                            setTimeout(() => { konus(haberler[0].title); }, 3000);
                            setTimeout(() => { konus(haberler[1].title); }, 7000);
                            setTimeout(() => { konus(haberler[2].title); }, 11000);
                        })
                        .catch(() => konus("Haber sunucularına şu an ulaşılamıyor."));

                // --- 3. WIKIPEDIA BİLGİ ARAMASI ---
                } else if (sorgu.includes("nedir") || sorgu.includes("kimdir")) {
                    konus("Veritabanımda arıyorum...");
                    let aranan = sorgu.replace("nedir", "").replace("kimdir", "").trim();
                    fetch(`https://tr.wikipedia.org/api/rest_v1/page/summary/${aranan}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.extract) {
                                konus(data.extract); // Özeti okur
                            } else {
                                konus("Bu konu hakkında kesin bir bilgi bulamadım.");
                            }
                        });

                // --- 4. ÖĞRENME VE HAFIZA SİSTEMİ ---
                } else if (sorgu.includes("şunu öğren") || sorgu.includes("aklında tut")) {
                    let ogrenilecekBilgi = sorgu.replace("şunu öğren", "").replace("aklında tut", "").trim();
                    
                    // Tarayıcının yerel hafızasına kaydet (Sekme kapansa bile silinmez)
                    let eskiBilgiler = localStorage.getItem("jarvis_hafiza") || "";
                    localStorage.setItem("jarvis_hafiza", eskiBilgiler + " | " + ogrenilecekBilgi);
                    
                    konus("Bu bilgiyi hafızama kaydettim.");

                } else if (sorgu.includes("neler biliyorsun") || sorgu.includes("ne öğrenmiştin") || sorgu.includes("hafızanda ne var")) {
                    let bilgiler = localStorage.getItem("jarvis_hafiza");
                    if (bilgiler) {
                        konus("Öğrettiğiniz kayıtlar şunlar: " + bilgiler.replace(/\|/g, ". "));
                    } else {
                        konus("Hafızamda henüz size dair özel bir kayıt bulunmuyor.");
                    }
                    
                } else if (sorgu.includes("hafızayı temizle") || sorgu.includes("bildiklerini unut")) {
                    localStorage.removeItem("jarvis_hafiza");
                    konus("Tüm kişisel kayıtlar sistemden silindi.");

                } else {
                    konus("Bu komutu eşleştiremedim. Söylemek istediğiniz kelimeleri netleştirin.");
                }
            };

            btn.addEventListener('click', () => {
                recognition.start();
            });
        }
    </script>
</body>
</html>
