<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - Gerçek Yapay Zeka Çekirdeği v8.1 (Güvenli)</title>
    
    <!-- PDF Okuma Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            --jarvis-mavi: #00f3ff;
            --jarvis-koyu: #050a0f;
            --kullanici-yesil: #00ff6a;
            --hata-kirmizi: #ff003c;
            --uyari-sari: #ffcc00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--jarvis-koyu);
            color: var(--jarvis-mavi);
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sol Panel */
        #sol-panel {
            width: 320px;
            border-right: 1px solid rgba(0, 243, 255, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to right, rgba(0,0,0,0.8), rgba(0,20,30,0.5));
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .baslik {
            font-size: 28px;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px var(--jarvis-mavi);
            font-weight: bold;
        }

        #sistem-saati {
            font-size: 18px;
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .izleme-durumu {
            font-size: 11px;
            text-align: center;
            color: var(--uyari-sari);
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: nefesAlma 2s infinite;
        }

        @keyframes nefesAlma {
            0% { opacity: 0.5; text-shadow: none; }
            50% { opacity: 1; text-shadow: 0 0 8px var(--uyari-sari); }
            100% { opacity: 0.5; text-shadow: none; }
        }

        .radar-container {
            width: 160px;
            height: 160px;
            margin: 0 auto 30px auto;
            border: 2px solid var(--jarvis-mavi);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(0,243,255,0.1) 0%, rgba(0,0,0,0) 70%);
        }

        .ses-dalgasi {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: absolute;
            border: 2px solid var(--jarvis-mavi);
            opacity: 0;
            transition: all 0.2s ease-out;
        }

        .aktif-dalga { animation: dalgalanma 1.2s infinite ease-out; }

        @keyframes dalgalanma {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        .durum-metni {
            text-align: center;
            font-size: 13px;
            margin-bottom: 20px;
            height: 60px;
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        #ses-baslat-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--jarvis-mavi);
            color: var(--jarvis-mavi);
            padding: 15px;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            border-radius: 5px;
            font-weight: bold;
        }

        #ses-baslat-btn:hover {
            background: var(--jarvis-mavi);
            color: var(--jarvis-koyu);
            box-shadow: 0 0 20px var(--jarvis-mavi);
        }

        /* Sağ Panel */
        #sag-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #020406;
        }

        #terminal {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .mesaj {
            padding: 12px 18px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 14px;
            animation: belirmeyeGiris 0.3s ease-out forwards;
            opacity: 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        @keyframes belirmeyeGiris {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mesaj-jarvis {
            align-self: flex-start;
            border-left: 4px solid var(--jarvis-mavi);
            background: rgba(0, 243, 255, 0.08);
            border-top-left-radius: 0;
        }

        .mesaj-kullanici {
            align-self: flex-end;
            border-right: 4px solid var(--kullanici-yesil);
            background: rgba(0, 255, 106, 0.08);
            color: var(--kullanici-yesil);
            text-align: right;
            border-top-right-radius: 0;
        }

        .mesaj-uyari {
            align-self: center;
            border: 2px solid var(--uyari-sari);
            background: rgba(255, 204, 0, 0.1);
            color: var(--uyari-sari);
            text-align: center;
            width: 90%;
        }
        
        .mesaj-sistem {
            align-self: center;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            border: none;
            background: none;
        }

        /* CHAT ALANI */
        #chat-alani {
            display: flex;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(0, 243, 255, 0.2);
            gap: 15px;
            align-items: center;
        }

        #dosya-sec-btn {
            background: transparent;
            color: var(--jarvis-mavi);
            border: 1px solid var(--jarvis-mavi);
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 20px;
        }

        #metin-girisi {
            flex-grow: 1;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 5px;
            color: var(--jarvis-mavi);
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }

        #gonder-btn {
            background: var(--jarvis-mavi);
            color: var(--jarvis-koyu);
            border: none;
            padding: 0 30px;
            height: 50px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        #terminal::-webkit-scrollbar { width: 10px; }
        #terminal::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.6); }
        #terminal::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.3); border-radius: 5px; }

        /* Yükleme animasyonu */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 243, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--jarvis-mavi);
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="sol-panel">
        <div class="baslik">J.A.R.V.I.S</div>
        <div id="sistem-saati">00:00:00</div>
        <div class="izleme-durumu">● GEMINI AI ÇEKİRDEĞİ DEVREDE</div>
        
        <div class="radar-container">
            <div id="ses-efekti" class="ses-dalgasi"></div>
            <div style="font-size: 11px; text-align: center; color: rgba(255,255,255,0.7);">
                <span style="color: var(--jarvis-mavi); font-weight: bold;">T.A.L.H.A</span><br>ÇEKİRDEĞİ
            </div>
        </div>

        <div id="durum" class="durum-metni">Sistem Başlatılıyor...<br>Lütfen bekleyin.</div>
        <button id="ses-baslat-btn">MİKROFONU AÇ / DİNLE</button>
    </div>

    <div id="sag-panel">
        <div id="terminal">
            <div class="mesaj mesaj-sistem">
                -- Ağ Bağlantısı Kuruldu | Tarih: <span id="sys-date"></span> --
            </div>
            <div class="mesaj mesaj-jarvis">
                <b>SİSTEM:</b> J.A.R.V.I.S Gerçek Yapay Zeka Protokolü yüklendi.
            </div>
        </div>
        
        <div id="chat-alani">
            <input type="file" id="dosya-yukle" accept=".txt,.pdf" style="display: none;">
            <button id="dosya-sec-btn" title="PDF veya Metin Belgesi Yükle">📁</button>
            <input type="text" id="metin-girisi" placeholder="İstediğiniz her şeyi sorabilirsiniz..." autocomplete="off">
            <button id="gonder-btn">Gönder</button>
        </div>
    </div>

    <script>
        // API KEY TARAYICI HAFIZASINDAN ÇEKİLİYOR
        let GEMINI_API_KEY = localStorage.getItem('jarvis_api_key');
        
        document.getElementById('sys-date').textContent = new Date().toLocaleDateString('tr-TR');
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        function saatGuncelle() {
            document.getElementById('sistem-saati').textContent = new Date().toLocaleTimeString('tr-TR');
        }
        setInterval(saatGuncelle, 1000);
        saatGuncelle();

        class Arayuz {
            static logYazdir(kim, metin) {
                const terminal = document.getElementById('terminal');
                const yukleniyorDiv = document.getElementById('yukleniyor-mesaj');
                if (yukleniyorDiv) yukleniyorDiv.remove();

                const mesajDiv = document.createElement('div');
                if (kim === 'uyari') {
                    mesajDiv.className = `mesaj mesaj-uyari`;
                    mesajDiv.innerHTML = `<b>⚠️ BİLDİRİM ⚠️</b><br>${metin}`;
                } else if (kim === 'sistem') {
                    mesajDiv.className = `mesaj mesaj-sistem`;
                    mesajDiv.innerHTML = metin;
                } else {
                    mesajDiv.className = `mesaj mesaj-${kim}`;
                    const temizMetin = metin.replace(/\*\*/g, '').replace(/\*/g, '');
                    const kimlik = kim === 'jarvis' ? 'J.A.R.V.I.S' : 'SİZ';
                    mesajDiv.innerHTML = `<b>${kimlik}:</b> ${temizMetin}`;
                }
                terminal.appendChild(mesajDiv);
                setTimeout(() => { terminal.scrollTo({ top: terminal.scrollHeight, behavior: 'smooth' }); }, 50);
            }

            static dusunuyorGoster() {
                const terminal = document.getElementById('terminal');
                const mesajDiv = document.createElement('div');
                mesajDiv.id = 'yukleniyor-mesaj';
                mesajDiv.className = `mesaj mesaj-jarvis`;
                mesajDiv.innerHTML = `<b>J.A.R.V.I.S:</b> <div class="loading"></div> Veriler işleniyor...`;
                terminal.appendChild(mesajDiv);
                terminal.scrollTop = terminal.scrollHeight;
            }

            static durumGuncelle(metin) { document.getElementById('durum').innerHTML = metin; }
            static dalgaAnimasyonu(aktif) {
                const dalga = document.getElementById('ses-efekti');
                if (aktif) dalga.classList.add('aktif-dalga');
                else dalga.classList.remove('aktif-dalga');
            }
        }

        class SesMotoru {
            constructor(beyin) {
                this.beyin = beyin;
                this.konusuyorMu = false;
                this.sentez = window.speechSynthesis;
                this.btn = document.getElementById('ses-baslat-btn');
                this.sesTanimaKur();
            }

            sesTanimaKur() {
                const STT = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!STT) {
                    this.btn.innerText = "Mikrofon Desteklenmiyor";
                    Arayuz.durumGuncelle("Lütfen Chrome kullanın veya Chat'ten yazın.");
                    return;
                }

                this.dinleyici = new STT();
                this.dinleyici.lang = 'tr-TR';
                this.dinleyici.interimResults = false;

                this.dinleyici.onstart = () => {
                    Arayuz.durumGuncelle("Sizi dinliyorum...");
                    this.btn.innerText = "DİNLENİYOR...";
                    this.btn.classList.add("dinliyor");
                    Arayuz.dalgaAnimasyonu(true);
                };

                this.dinleyici.onresult = (event) => {
                    const komut = event.results[0][0].transcript;
                    Arayuz.logYazdir("kullanici", komut);
                    this.beyin.komutIsle(komut);
                };

                this.dinleyici.onerror = (event) => {
                    if (event.error === 'not-allowed') {
                        Arayuz.logYazdir("uyari", "MİKROFON İZNİ YOK! Dosyayı masaüstünden açtığınız için Chrome mikrofonu engelliyor. Lütfen kodu GitHub'a yükleyin veya komutları yazarak iletin.");
                        this.btn.innerText = "İZİN REDDEDİLDİ";
                    } else {
                        Arayuz.durumGuncelle("Duyamadım.");
                    }
                    this.btn.classList.remove("dinliyor");
                    Arayuz.dalgaAnimasyonu(false);
                };

                this.dinleyici.onend = () => {
                    if(this.btn.innerText !== "İZİN REDDEDİLDİ") this.btn.innerText = "MİKROFONU AÇ / DİNLE";
                    this.btn.classList.remove("dinliyor");
                    Arayuz.dalgaAnimasyonu(false);
                };

                this.btn.addEventListener('click', () => {
                    if (!this.konusuyorMu) {
                        try { this.dinleyici.start(); } catch(e) {}
                    }
                });
            }

            sesliSoyle(metin) {
                this.sentez.cancel(); 
                Arayuz.logYazdir("jarvis", metin);
                
                const okunacakMetin = metin.replace(/\*\*/g, '').replace(/\*/g, '');
                const utterance = new SpeechSynthesisUtterance(okunacakMetin);
                utterance.lang = 'tr-TR';
                utterance.rate = 1.0; 
                utterance.pitch = 0.9; 

                utterance.onstart = () => { 
                    this.konusuyorMu = true; 
                    Arayuz.dalgaAnimasyonu(true); 
                };
                
                utterance.onend = () => { 
                    this.konusuyorMu = false;
                    Arayuz.dalgaAnimasyonu(false);
                };

                this.sentez.speak(utterance);
            }
        }

        class HafizaYoneticisi {
            constructor() {
                this.hafizaAnahtari = "JARVIS_KULLANICI_BELLEGI";
                this.bellek = this.hafizayiYukle();
            }

            hafizayiYukle() {
                try {
                    const kayitliVeri = localStorage.getItem(this.hafizaAnahtari);
                    return kayitliVeri ? JSON.parse(kayitliVeri) : [];
                } catch (e) { return []; }
            }

            kaydet() { localStorage.setItem(this.hafizaAnahtari, JSON.stringify(this.bellek)); }

            yeniBilgiEkle(bilgi) {
                this.bellek.push(bilgi);
                this.kaydet();
            }

            ogrenilenleriGetir() {
                if (this.bellek.length === 0) return "";
                return "Talha Bey hakkında bilmen gerekenler: " + this.bellek.join(". ");
            }
        }

        class JarvisBeyin {
            constructor() {
                this.sonDosyaMetni = "";
                this.hafizaYoneticisi = new HafizaYoneticisi();
            }

            sesMotorunuBagla(motor) { this.motor = motor; }

            async geminiyeSor(kullaniciMetni, ekGorev = "") {
                if (!GEMINI_API_KEY) {
                    return "API Anahtarı bulunamadı. Lütfen sayfayı yenileyip anahtarı girin.";
                }

                let prompt = `Senin adın J.A.R.V.I.S. Sen Ömer Talha Kılıç tarafından tasarlanmış çok zeki bir yapay zeka asistanısın. Kısa, net, akıllıca ve saygılı cevaplar ver.\n\n`;
                
                const ogrenilenler = this.hafizaYoneticisi.ogrenilenleriGetir();
                if (ogrenilenler) prompt += `${ogrenilenler}\n\n`;
                if (ekGorev) prompt += `GÖREV/DOSYA İÇERİĞİ:\n${ekGorev}\n\n`;
                
                prompt += `Talha Bey diyor ki: ${kullaniciMetni}`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });

                    const veri = await response.json();
                    if (veri.candidates && veri.candidates[0].content.parts[0].text) {
                        return veri.candidates[0].content.parts[0].text;
                    } else {
                        return "Üzgünüm efendim, isteğinizi şu an işleyemiyorum.";
                    }
                } catch (hata) {
                    return "Gemini bağlantısında bir hata meydana geldi.";
                }
            }

            async komutIsle(hamKomut) {
                if (!hamKomut || hamKomut.trim() === "") return;
                
                Arayuz.dusunuyorGoster();

                let cevap = "";
                let kucukKomut = hamKomut.toLowerCase();

                if (kucukKomut.startsWith("şunu öğren") || kucukKomut.startsWith("hatırla") || kucukKomut.startsWith("unutma")) {
                    let ogrenilecekBilgi = hamKomut.replace(/şunu öğren|hatırla|unutma/gi, "").trim();
                    this.hafizaYoneticisi.yeniBilgiEkle(ogrenilecekBilgi);
                    cevap = await this.geminiyeSor(`Kullanıcı sana şunu öğretti: "${ogrenilecekBilgi}". Bunu hafızana aldığını onaylayan kısa ve havalı bir Jarvis cevabı ver.`);
                }
                else if (kucukKomut.includes("özetle") || kucukKomut.includes("dosyayı oku") || kucukKomut.includes("slaytı")) {
                    if (this.sonDosyaMetni === "") {
                        cevap = "Hafızamda taranmış bir dosya bulunmuyor efendim. Lütfen sol alttaki ikondan bir belge yükleyin.";
                    } else {
                        cevap = await this.geminiyeSor(hamKomut, `Lütfen şu metni Talha Bey için özetle:\n\n${this.sonDosyaMetni}`);
                    }
                } 
                else if (kucukKomut.includes("ekranı temizle")) {
                    document.getElementById('terminal').innerHTML = `<div class="mesaj mesaj-sistem">-- Ekran Temizlendi --</div>`;
                    this.motor.sesliSoyle("Arayüz temizlendi.");
                    return;
                }
                else {
                    cevap = await this.geminiyeSor(hamKomut);
                }

                this.motor.sesliSoyle(cevap);
            }
        }

        function dosyaSisteminiKur(jarvisBeyin) {
            const dosyaButon = document.getElementById('dosya-sec-btn');
            const dosyaInput = document.getElementById('dosya-yukle');

            dosyaButon.addEventListener('click', () => dosyaInput.click());

            dosyaInput.addEventListener('change', async function(e) {
                const dosya = e.target.files[0];
                if (!dosya) return;

                Arayuz.logYazdir("sistem", `[SİSTEM TARAMASI]: "${dosya.name}" sisteme alınıyor...`);
                Arayuz.durumGuncelle("Dosya taranıyor...");

                try {
                    if (dosya.type === "text/plain") {
                        const reader = new FileReader();
                        reader.onload = function(evt) {
                            jarvisBeyin.sonDosyaMetni = evt.target.result.substring(0, 30000); 
                            Arayuz.logYazdir("jarvis", "Metin belgesi tarandı. 'Bu dosyayı özetle' diyebilirsiniz.");
                            Arayuz.durumGuncelle("Hazır.");
                        };
                        reader.readAsText(dosya);
                    } 
                    else if (dosya.type === "application/pdf") {
                        const arrayBuffer = await dosya.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                        let tamMetin = "";
                        const sayfaSayisi = pdf.numPages > 15 ? 15 : pdf.numPages; 
                        
                        for (let i = 1; i <= sayfaSayisi; i++) {
                            const sayfa = await pdf.getPage(i);
                            const icerik = await sayfa.getTextContent();
                            const sayfaMetni = icerik.items.map(item => item.str).join(" ");
                            tamMetin += sayfaMetni + " ";
                        }

                        jarvisBeyin.sonDosyaMetni = tamMetin.substring(0, 30000);
                        Arayuz.logYazdir("jarvis", `Slayt/PDF belgesi tarandı. Dosya hakkında sorular sorabilirsiniz.`);
                        Arayuz.durumGuncelle("Hazır.");
                    } 
                } catch (hata) {
                    Arayuz.logYazdir("uyari", "Dosya okunurken bir hata oluştu.");
                }
                dosyaInput.value = "";
            });
        }

        function chatKurulumu(jarvisBeyin) {
            const input = document.getElementById('metin-girisi');
            const btn = document.getElementById('gonder-btn');

            function mesajGonder() {
                const metin = input.value.trim();
                if (metin) {
                    Arayuz.logYazdir("kullanici", metin);
                    jarvisBeyin.komutIsle(metin);
                    input.value = ''; 
                }
            }

            btn.addEventListener('click', mesajGonder);
            input.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') mesajGonder();
            });
            
            document.body.addEventListener('click', function unlockAudio() {
                const s = window.speechSynthesis;
                const u = new SpeechSynthesisUtterance('');
                u.volume = 0;
                s.speak(u);
                document.body.removeEventListener('click', unlockAudio);
            }, { once: true });
        }

        window.onload = () => {
            // Şifreyi sorma penceresi
            if (!GEMINI_API_KEY) {
                GEMINI_API_KEY = prompt("Lütfen J.A.R.V.I.S'i başlatmak için Gemini API Anahtarınızı girin:\n(Bu şifre sadece tarayıcınıza kaydedilecektir)");
                if (GEMINI_API_KEY) {
                    localStorage.setItem('jarvis_api_key', GEMINI_API_KEY);
                } else {
                    alert("API Anahtarı girmediniz. Sistem çevrimdışı olacak.");
                }
            }

            if (window.location.protocol === 'file:') {
                Arayuz.logYazdir("uyari", "MİKROFON UYARISI: HTML dosyasını masaüstünden açtığınız için Chrome mikrofona izin vermeyecektir. Lütfen dosyayı GitHub'a yükleyerek çalıştırın.");
            }

            const jarvis = new JarvisBeyin();
            const ses = new SesMotoru(jarvis);
            jarvis.sesMotorunuBagla(ses); 
            chatKurulumu(jarvis); 
            dosyaSisteminiKur(jarvis);
        };
    </script>
</body>
</html>
