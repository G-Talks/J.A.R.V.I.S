<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - Merkezi İşletim Sistemi v3.0</title>
    <style>
        /* --- GELİŞMİŞ GÖRSEL ARAYÜZ (UI) AYARLARI --- */
        :root {
            --jarvis-mavi: #00f3ff;
            --jarvis-koyu: #050a0f;
            --kullanici-yesil: #00ff6a;
            --hata-kirmizi: #ff003c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--jarvis-koyu);
            color: var(--jarvis-mavi);
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sol Panel - Durum ve Kontroller */
        #sol-panel {
            width: 320px;
            border-right: 1px solid rgba(0, 243, 255, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to right, rgba(0,0,0,0.8), rgba(0,20,30,0.5));
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .baslik {
            font-size: 28px;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 30px;
            text-shadow: 0 0 15px var(--jarvis-mavi);
            font-weight: bold;
        }

        .radar-container {
            width: 160px;
            height: 160px;
            margin: 0 auto 40px auto;
            border: 2px solid var(--jarvis-mavi);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(0,243,255,0.1) 0%, rgba(0,0,0,0) 70%);
        }

        /* Konuşma anındaki dalga animasyonu */
        .ses-dalgasi {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: absolute;
            border: 2px solid var(--jarvis-mavi);
            opacity: 0;
            transition: all 0.2s ease-out;
        }

        .aktif-dalga { animation: dalgalanma 1.2s infinite ease-out; }

        @keyframes dalgalanma {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        .durum-metni {
            text-align: center;
            font-size: 15px;
            margin-bottom: 30px;
            height: 50px;
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        #ses-baslat-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--jarvis-mavi);
            color: var(--jarvis-mavi);
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            border-radius: 5px;
            font-weight: bold;
        }

        #ses-baslat-btn:hover {
            background: var(--jarvis-mavi);
            color: var(--jarvis-koyu);
            box-shadow: 0 0 20px var(--jarvis-mavi);
        }

        #ses-baslat-btn.dinliyor {
            background: rgba(255, 0, 60, 0.2);
            border-color: var(--hata-kirmizi);
            color: var(--hata-kirmizi);
            box-shadow: 0 0 20px var(--hata-kirmizi);
            animation: pulse-kirmizi 1.5s infinite;
        }

        @keyframes pulse-kirmizi {
            0% { box-shadow: 0 0 10px var(--hata-kirmizi); }
            50% { box-shadow: 0 0 25px var(--hata-kirmizi); }
            100% { box-shadow: 0 0 10px var(--hata-kirmizi); }
        }

        /* Sağ Panel - Terminal ve Chat Ekranı */
        #sag-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #020406;
        }

        #terminal {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .mesaj {
            padding: 12px 18px;
            border-radius: 8px;
            max-width: 75%;
            line-height: 1.5;
            font-size: 16px;
            animation: belirmeyeGiris 0.3s ease-out forwards;
            opacity: 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        @keyframes belirmeyeGiris {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mesaj-jarvis {
            align-self: flex-start;
            border-left: 4px solid var(--jarvis-mavi);
            background: rgba(0, 243, 255, 0.08);
            border-top-left-radius: 0;
        }

        .mesaj-kullanici {
            align-self: flex-end;
            border-right: 4px solid var(--kullanici-yesil);
            background: rgba(0, 255, 106, 0.08);
            color: var(--kullanici-yesil);
            text-align: right;
            border-top-right-radius: 0;
        }

        /* YAZILI SOHBET (CHAT) ALANI */
        #chat-alani {
            display: flex;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(0, 243, 255, 0.2);
            gap: 15px;
        }

        #metin-girisi {
            flex-grow: 1;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 5px;
            color: var(--jarvis-mavi);
            font-family: inherit;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        #metin-girisi:focus {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--jarvis-mavi);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        #metin-girisi::placeholder {
            color: rgba(0, 243, 255, 0.4);
        }

        #gonder-btn {
            background: var(--jarvis-mavi);
            color: var(--jarvis-koyu);
            border: none;
            padding: 0 30px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        #gonder-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px var(--jarvis-mavi);
        }

        /* Terminal Scrollbar */
        #terminal::-webkit-scrollbar { width: 10px; }
        #terminal::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.6); }
        #terminal::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.3); border-radius: 5px; }
        #terminal::-webkit-scrollbar-thumb:hover { background: rgba(0, 243, 255, 0.6); }

        .system-msg {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            margin: 10px 0;
            width: 100%;
            align-self: center;
            border: none;
            background: none;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div id="sol-panel">
        <div class="baslik">J.A.R.V.I.S</div>
        
        <div class="radar-container">
            <div id="ses-efekti" class="ses-dalgasi"></div>
            <div style="font-size: 11px; text-align: center; color: rgba(255,255,255,0.7);">
                <span style="color: var(--jarvis-mavi); font-weight: bold;">T.A.L.H.A</span><br>ÇEKİRDEĞİ
            </div>
        </div>

        <div id="durum" class="durum-metni">Sistem Başlatılıyor...<br>Lütfen bekleyin.</div>
        
        <button id="ses-baslat-btn">Sistemi Aktifleştir (Mikrofon)</button>
    </div>

    <div id="sag-panel">
        <div id="terminal">
            <div class="mesaj system-msg">
                -- Bağlantı Kuruldu | Tarih: <span id="sys-date"></span> --
            </div>
            <div class="mesaj mesaj-jarvis">
                <b>SİSTEM:</b> J.A.R.V.I.S Protokolü v3.0 yüklendi. Kalıcı hafıza birimleri çevrimiçi. Veritabanı bütünlüğü: %100.
            </div>
        </div>
        
        <!-- YAZILI SOHBET ALANI -->
        <div id="chat-alani">
            <input type="text" id="metin-girisi" placeholder="J.A.R.V.I.S'e komut yazın..." autocomplete="off">
            <button id="gonder-btn">Gönder</button>
        </div>
    </div>

    <script>
        document.getElementById('sys-date').textContent = new Date().toLocaleDateString('tr-TR');

        /**
         * LIMITLERI ZORLAYAN J.A.R.V.I.S MİMARİSİ
         */

        // --- 1. HAFIZA MERKEZİ ---
        class HafizaYoneticisi {
            constructor() {
                this.hafizaAnahtari = "JARVIS_DERIN_BELLEK_V3";
                this.bellek = this.hafizayiYukle();
                this.cekirdekBilgileriGuncelle();
            }

            hafizayiYukle() {
                try {
                    const kayitliVeri = localStorage.getItem(this.hafizaAnahtari);
                    return kayitliVeri ? JSON.parse(kayitliVeri) : { kisisel: {}, ogrenilenler: [] };
                } catch (e) {
                    console.error("Hafıza yükleme hatası:", e);
                    return { kisisel: {}, ogrenilenler: [] };
                }
            }

            kaydet() {
                try {
                    localStorage.setItem(this.hafizaAnahtari, JSON.stringify(this.bellek));
                } catch (e) {
                    console.error("Hafıza kaydetme hatası:", e);
                }
            }

            cekirdekBilgileriGuncelle() {
                this.bellek.kisisel = {
                    isim: "Ömer Talha Kılıç",
                    hitap: "Talha Bey",
                    partner: "Ümmü Sude Turan",
                    okul: "Konya Gıda ve Tarım Üniversitesi Moleküler Biyoloji ve Genetik bölümü",
                    unvan: "İletişim ve Tanıtım Topluluğu Başkanı ve proje koordinatörü",
                    takim: "Galatasaray",
                    araba: "Citroën C-Elysée",
                    yetenekler: "Web geliştirme, kodlama, Canva tasarımı ve liderlik"
                };
                this.kaydet();
            }

            yeniBilgiOgren(bilgi) {
                const zaman = new Date().toLocaleDateString('tr-TR');
                this.bellek.ogrenilenler.push({ veri: bilgi, tarih: zaman });
                this.kaydet();
            }

            ogrenilenleriGetir() {
                if (!this.bellek.ogrenilenler || this.bellek.ogrenilenler.length === 0) 
                    return "Şu an için sonradan öğrendiğim özel bir bilgi yok.";
                
                let metin = "Kalıcı belleğimdeki kayıtlarınız şunlar: ";
                this.bellek.ogrenilenler.forEach((item, index) => {
                    metin += `${index + 1}. ${item.veri}. `;
                });
                return metin;
            }

            hafizayiSifirla() {
                this.bellek.ogrenilenler = [];
                this.kaydet();
            }
        }

        // --- 2. GÖRSEL VE İŞİTSEL ARAYÜZ ---
        class Arayuz {
            static logYazdir(kim, metin) {
                const terminal = document.getElementById('terminal');
                const mesajDiv = document.createElement('div');
                mesajDiv.className = `mesaj mesaj-${kim}`;
                
                const kimlik = kim === 'jarvis' ? 'J.A.R.V.I.S' : 'SİZ';
                mesajDiv.innerHTML = `<b>${kimlik}:</b> ${metin}`;
                
                terminal.appendChild(mesajDiv);
                
                // Kaydırmayı pürüzsüz yap
                setTimeout(() => {
                    terminal.scrollTo({
                        top: terminal.scrollHeight,
                        behavior: 'smooth'
                    });
                }, 50);
            }

            static durumGuncelle(metin) {
                document.getElementById('durum').innerHTML = metin;
            }

            static dalgaAnimasyonu(aktif) {
                const dalga = document.getElementById('ses-efekti');
                if (aktif) dalga.classList.add('aktif-dalga');
                else dalga.classList.remove('aktif-dalga');
            }
        }

        // --- 3. DİNLEME VE KONUŞMA MOTORU ---
        class SesMotoru {
            constructor(beyin) {
                this.beyin = beyin;
                this.konusuyorMu = false;
                this.sentez = window.speechSynthesis;
                this.btn = document.getElementById('ses-baslat-btn');
                
                this.sesTanimaKur();
                Arayuz.durumGuncelle("Sistem Hazır.<br>Mikrofon veya Chat ile komut verebilirsiniz.");
            }

            sesTanimaKur() {
                const STT = window.SpeechRecognition || window.webkitSpeechRecognition;
                
                if (!STT) {
                    Arayuz.logYazdir("jarvis", "HATA: Tarayıcınız ses tanıma özelliğini desteklemiyor. Lütfen Chrome kullanın.");
                    this.btn.innerText = "Mikrofon Desteklenmiyor";
                    this.btn.disabled = true;
                    return;
                }

                this.dinleyici = new STT();
                this.dinleyici.lang = 'tr-TR';
                this.dinleyici.interimResults = false;
                this.dinleyici.maxAlternatives = 1;

                this.dinleyici.onstart = () => {
                    Arayuz.durumGuncelle("Sizi dinliyorum...");
                    this.btn.innerText = "DİNLENİYOR...";
                    this.btn.classList.add("dinliyor");
                    Arayuz.dalgaAnimasyonu(true);
                };

                this.dinleyici.onresult = (event) => {
                    const komut = event.results[0][0].transcript;
                    Arayuz.logYazdir("kullanici", komut);
                    this.beyin.komutIsle(komut);
                };

                this.dinleyici.onerror = (event) => {
                    console.error("Ses Tanıma Hatası:", event.error);
                    let hataMesaji = "Mikrofon hatası: " + event.error;
                    if (event.error === 'not-allowed') {
                        hataMesaji = "Lütfen tarayıcı ayarlarından MİKROFON İZNİ verin!";
                    }
                    Arayuz.durumGuncelle(hataMesaji);
                };

                this.dinleyici.onend = () => {
                    this.btn.innerText = "Sistemi Aktifleştir (Mikrofon)";
                    this.btn.classList.remove("dinliyor");
                    Arayuz.dalgaAnimasyonu(false);
                    if(!this.konusuyorMu) Arayuz.durumGuncelle("Sistem beklemede.");
                };

                this.btn.addEventListener('click', () => {
                    if (!this.konusuyorMu) {
                        try { 
                            this.dinleyici.start(); 
                        } catch(e) {
                            console.error("Dinleyici başlatılamadı:", e);
                        }
                    }
                });
            }

            sesliSoyle(metin) {
                this.sentez.cancel(); // Önceki konuşmayı kes
                
                Arayuz.logYazdir("jarvis", metin);
                
                const utterance = new SpeechSynthesisUtterance(metin);
                utterance.lang = 'tr-TR';
                utterance.rate = 1.0;
                utterance.pitch = 1.0; 

                utterance.onstart = () => { 
                    this.konusuyorMu = true; 
                    Arayuz.durumGuncelle("Yanıt veriliyor...");
                };
                
                utterance.onend = () => { 
                    this.konusuyorMu = false;
                    Arayuz.durumGuncelle("Sistem beklemede.");
                };
                
                utterance.onerror = (e) => {
                    console.error("Konuşma Hatası:", e);
                    this.konusuyorMu = false;
                }

                this.sentez.speak(utterance);
            }
        }

        // --- 4. MERKEZİ İŞLEMCİ (YAPAY ZEKA BEYNİ) ---
        class JarvisBeyin {
            constructor() {
                this.hafiza = new HafizaYoneticisi();
            }

            sesMotorunuBagla(motor) {
                this.motor = motor;
            }

            async veriCek(url) {
                try {
                    const cevap = await fetch(url);
                    if (!cevap.ok) throw new Error("Ağ hatası");
                    return await cevap.json();
                } catch (error) {
                    console.error("Veri çekme hatası:", error);
                    return null;
                }
            }

            async komutIsle(hamKomut) {
                if (!hamKomut || hamKomut.trim() === "") return;
                
                const komut = hamKomut.toLowerCase().trim();
                const kisisel = this.hafiza.bellek.kisisel;

                // --- A. SELAMLAŞMA VE ZAMAN ---
                if (komut.includes("merhaba") || komut.includes("nasılsın")) {
                    this.motor.sesliSoyle(`Sistemler tam kapasite devrede ${kisisel.hitap}. Size nasıl hizmet edebilirim?`);
                }
                else if (komut.includes("saat kaç") || komut === "saat") {
                    const saat = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                    this.motor.sesliSoyle(`Yerel saat şu an ${saat} efendim.`);
                }
                else if (komut.includes("hangi gün") || komut.includes("tarih ne") || komut === "tarih") {
                    const tarih = new Date().toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                    this.motor.sesliSoyle(`Bugün ${tarih}.`);
                }

                // --- B. DERİN HAFIZA VE KİMLİK SORGULARI ---
                else if (komut.includes("ben kimim") || komut.includes("beni tanıt")) {
                    this.motor.sesliSoyle(`Siz ${kisisel.isim}'sınız. Benim mimarımsınız. ${kisisel.okul}'nde okuyor ve ${kisisel.unvan} görevini yürütüyorsunuz.`);
                }
                else if (komut.includes("kız arkadaşım") || komut.includes("sevgilim") || komut.includes("sude")) {
                    this.motor.sesliSoyle(`Kız arkadaşınız ${kisisel.partner}. Dosyalarıma göre kendisi sizin için dünyadaki en değerli kişi.`);
                }
                else if (komut.includes("arabam") || komut.includes("motorum")) {
                    this.motor.sesliSoyle(`Verilerime göre bir ${kisisel.araba} kullanıyorsunuz. Ayrıca 50 cc motosikletlere karşı özel bir ilginiz var.`);
                }
                else if (komut.includes("hangi takım") || komut.includes("takımlıyım")) {
                    this.motor.sesliSoyle(`Siz koyu bir ${kisisel.takim} taraftarısınız ${kisisel.hitap}.`);
                }

                // --- C. DİNAMİK ÖĞRENME MOTORU ---
                else if (komut.startsWith("şunu öğren") || komut.startsWith("bunu kaydet") || komut.startsWith("aklında tut")) {
                    let ogrenilecekMetin = komut.replace("şunu öğren", "").replace("bunu kaydet", "").replace("aklında tut", "").trim();
                    if (ogrenilecekMetin.length > 2) {
                        this.hafiza.yeniBilgiOgren(ogrenilecekMetin);
                        this.motor.sesliSoyle(`Anlaşıldı ${kisisel.hitap}. "${ogrenilecekMetin}" bilgisini kalıcı veritabanıma kaydettim.`);
                    } else {
                        this.motor.sesliSoyle("Neyi öğrenmem gerektiğini anlayamadım efendim. Lütfen cümleyi net kurun.");
                    }
                }
                else if (komut.includes("neler biliyorsun") || komut.includes("öğrendiklerini say") || komut.includes("hafızanda ne var")) {
                    const rapor = this.hafiza.ogrenilenleriGetir();
                    this.motor.sesliSoyle(rapor);
                }
                else if (komut.includes("hafızayı temizle") || komut.includes("bildiklerini unut")) {
                    this.hafiza.hafizayiSifirla();
                    this.motor.sesliSoyle("Onaylandı. Sonradan eklenen tüm veriler kalıcı bellekten silindi.");
                }

                // --- D. İNTERNET VE API BAĞLANTILARI ---
                else if (komut.includes("gündem") || komut.includes("haberler")) {
                    this.motor.sesliSoyle("Haber ağlarına bağlanıyorum...");
                    const data = await this.veriCek('https://api.rss2json.com/v1/api.json?rss_url=https://www.trthaber.com/manset_artikeller.rss');
                    if (data && data.items && data.items.length > 0) {
                        this.motor.sesliSoyle("Gündemdeki haberler:");
                        // Sadece ilk haberi okuyalım ki çok uzamasın (Chat için daha iyi)
                        setTimeout(() => { this.motor.sesliSoyle(data.items[0].title); }, 2000);
                        if(data.items.length > 1) {
                             setTimeout(() => { this.motor.sesliSoyle(data.items[1].title); }, 6000);
                        }
                    } else {
                        this.motor.sesliSoyle("Haber sunucularıyla iletişim kurulamadı.");
                    }
                }
                else if (komut.includes("kimdir") || komut.includes("nedir")) {
                    this.motor.sesliSoyle("Wikipedia'da arıyorum...");
                    let aranan = komut.replace("kimdir", "").replace("nedir", "").replace("bana", "").replace("anlat", "").trim();
                    if(aranan.length === 0) {
                        this.motor.sesliSoyle("Neyi aramam gerektiğini belirtmediniz.");
                        return;
                    }
                    
                    const data = await this.veriCek(`https://tr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(aranan)}`);
                    
                    if (data && data.extract) {
                        this.motor.sesliSoyle(data.extract);
                    } else {
                        this.motor.sesliSoyle(`'${aranan}' hakkında küresel ağda net bir kayıt bulamadım.`);
                    }
                }
                else if (komut.includes("youtube aç") || komut === "youtube") {
                    this.motor.sesliSoyle("YouTube protokolü başlatılıyor.");
                    window.open("https://www.youtube.com", "_blank");
                }
                else if (komut.includes("google aç") || komut === "google") {
                    this.motor.sesliSoyle("Google arama motoru açılıyor.");
                    window.open("https://www.google.com", "_blank");
                }

                // --- E. SİSTEM KOMUTLARI ---
                else if (komut.includes("ekranı temizle") || komut === "temizle") {
                    const terminal = document.getElementById('terminal');
                    terminal.innerHTML = `<div class="mesaj system-msg">-- Ekran Temizlendi --</div>`;
                    this.motor.sesliSoyle("Arayüz temizlendi.");
                }
                
                else {
                    this.motor.sesliSoyle("Bu komut sistemimde tanımlı değil. Anlayamadım.");
                }
            }
        }

        // --- 5. CHAT (YAZILI GİRİŞ) YÖNETİMİ ---
        function chatKurulumu(jarvisBeyin) {
            const input = document.getElementById('metin-girisi');
            const btn = document.getElementById('gonder-btn');

            function mesajGonder() {
                const metin = input.value.trim();
                if (metin) {
                    Arayuz.logYazdir("kullanici", metin);
                    jarvisBeyin.komutIsle(metin);
                    input.value = ''; // Kutuyu temizle
                }
            }

            btn.addEventListener('click', mesajGonder);
            input.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    mesajGonder();
                }
            });
        }

        // --- 6. SİSTEMİ BAŞLATMA (BOOT SEQUENCE) ---
        window.onload = () => {
            const jarvis = new JarvisBeyin();
            const ses = new SesMotoru(jarvis);
            jarvis.sesMotorunuBagla(ses); 
            
            chatKurulumu(jarvis); // Chat arayüzünü beyne bağla
